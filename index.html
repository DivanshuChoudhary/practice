<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie</title>
    <link rel="stylesheet" href="style.css">
</head>
<script src="script.js"></script>
<body>

<header>
    <h2>🍕 Foodie</h2>

    <nav>
        <a href="#">Home</a>
        <a href="#">Menu</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="hero">

    <div class="hero-text">
        <h1>Delicious Food Delivered To You</h1>

        <p>
            Fresh meals, fast delivery and amazing taste.
        </p>

        <button>Order Now</button>

    </div>

    <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500" alt="Pizza">

</section>

<section class="search-section">

    <input
        type="text"
        id="search"
        placeholder="Search Food...">

        <div class="filter-buttons">

    <button class="filter-btn active" data-category="all">All</button>

    <button class="filter-btn" data-category="pizza">Pizza</button>

    <button class="filter-btn" data-category="burger">Burger</button>

    <button class="filter-btn" data-category="pasta">Pasta</button>

</div>

</section>

<section class="menu">

    <h2>Popular Dishes</h2>

    <div class="food-container">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=400" alt="Pizza">
            <h3>Cheese Pizza</h3>
            <p>$12.99</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400" alt="Burger">
            <h3>Chicken Burger</h3>
            <p>$9.99</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9?w=400" alt="Pasta">
            <h3>Italian Pasta</h3>
            <p>$11.99</p>
            <button>Add to Cart</button>
        </div>

    </div>

</section>

</body>
</html>
