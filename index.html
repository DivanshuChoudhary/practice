<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->

    <header>

        <h2>🍕 Foodie</h2>

        <nav>

            <a href="#">Home</a>
            <a href="#">Menu</a>
            <a href="#">About</a>
            <a href="#">Contact</a>

        </nav>

        <div class="cart">

            🛒 <span id="cart-count">0</span>

        </div>

    </header>

    <!-- Hero -->

    <section class="hero">

        <div class="hero-text">

            <h1>Delicious Food Delivered To You</h1>

            <p>
                Fresh meals made with love.
            </p>

            <button>Order Now</button>

        </div>

        <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=700"
             alt="Pizza">

    </section>

    <!-- Search -->

    <section class="search-section">

        <input
            type="text"
            id="search"
            placeholder="Search Food...">

    </section>

    <!-- Filter -->

    <div class="filter-buttons">

        <button class="filter-btn active" data-category="all">All</button>

        <button class="filter-btn" data-category="pizza">Pizza</button>

        <button class="filter-btn" data-category="burger">Burger</button>

        <button class="filter-btn" data-category="pasta">Pasta</button>

    </div>

    <!-- Menu -->

    <section class="menu">

        <h2>Popular Dishes</h2>

        <div class="food-container">

            <!-- Pizza -->

            <div class="card pizza"
                data-name="Cheese Pizza"
                data-price="12.99">

                <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500">

                <h3>Cheese Pizza</h3>

                <p>$12.99</p>

                <button class="add-cart">
                    Add to Cart
                </button>

            </div>

            <!-- Burger -->

            <div class="card burger"
                data-name="Chicken Burger"
                data-price="9.99">

                <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500">

                <h3>Chicken Burger</h3>

                <p>$19.99</p>

                <button class="add-cart">
                    Add to Cart
                </button>

            </div>

            <!-- Pasta -->

            <div class="card pasta"
                data-name="Italian Pasta"
                data-price="15.99">

                <img src="https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9?w=500">

                <h3>Italian Pasta</h3>

                <p>$11.99</p>

                <button class="add-cart">
                    Add to Cart
                </button>

            </div>

        </div>

    </section>

    <!-- Cart -->

    <section class="cart-section">

        <h2>Your Cart</h2>

        <ul id="cart-items"></ul>

        <h3>

            Total : $

            <span id="total-price">

                0

            </span>

        </h3>

    </section>

    <script src="script.js"></script>

</body>
</html>
